<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Warehouse Strike — 5v5 FPS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #e5e7eb;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .badge {
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(75, 85, 99, 0.5);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      backdrop-filter: blur(8px);
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 8px;
    }
    #debug-overlay {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 14px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.5;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="ui-overlay">
    <div class="hud-header">
      <div class="badge">
        <span class="status-dot"></span><span id="connection-status">Connecting to Warehouse Strike Server...</span>
      </div>
      <div class="badge" id="room-info">Room: Pending | Phase 1 Foundation</div>
    </div>
    <div id="debug-overlay">
      <div>FPS: <span id="dbg-fps">60</span></div>
      <div>Server: <span id="dbg-server">ws://localhost:2567</span></div>
      <div>Engine: Three.js WebGL2</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
